spring.application.name=cacamba-manager

# Configurações padrão (sem perfil ativo) - PostgreSQL

# Configurações do banco de dados PostgreSQL (padrão)
spring.datasource.url=jdbc:postgresql://localhost:5432/cacamba?sslmode=disable
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configurações de pool de conexão
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Configurações JPA/Hibernate para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configurações Flyway para PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.database-type=postgresql
spring.flyway.encoding=UTF-8
spring.flyway.clean-disabled=false
spring.flyway.baseline-version=0
spring.flyway.clean-on-validation-error=true

# Configurações do servidor
server.port=8080

# Configurações de Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# definir via env var
spring.mail.username=${EMAIL_USERNAME}
# definir via env var (sem default — nunca commitar a App Password)
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configurações de Notificação
app.notification.email.enabled=true
app.notification.email.from=${EMAIL_USERNAME}
app.notification.email.from-name=Gerenciador de Caçambas
# definir via env var (cai no EMAIL_USERNAME se não definida)
app.notification.email.report-to=${EMAIL_REPORT_TO:${EMAIL_USERNAME}}

# Logging - DEBUG para investigação de autenticação
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.web=INFO
logging.level.org.springframework.security.authentication=INFO
logging.level.org.springframework.security.crypto=INFO
logging.level.com.eccolimp.cacamba_manager.security=INFO
logging.level.org.springframework.security.authentication.dao=INFO